server:
  port: 8080

spring:
  application:
    name: weekly-board

  datasource:
    url: jdbc:postgresql://localhost:5432/weekly_board
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

